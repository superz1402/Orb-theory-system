name: voice-tts

# Orb Theory production voice (S4). Runs scripts/edge_tts_actions.py on a
# clean-network runner: Edge TTS, house voice, WordBoundary capture.
# See docs/github-actions.md.

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Script file to voice (repo-relative)"
        required: true
        default: ".github/smoke/tts.txt"
      voice:
        description: "Edge TTS voice"
        required: false
        default: "en-US-AndrewMultilingualNeural"
      rate:
        description: "Prosody rate (house: -3%, long-form -4%)"
        required: false
        default: "-3%"
  push:
    paths:
      - "episodes/**/voice-input.txt"
      - ".github/smoke/tts.txt"

permissions:
  contents: write # commit the run record back under runs/ (see docs/github-actions.md)

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + edge-tts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet edge-tts

      - name: Resolve script path
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCRIPT="${{ inputs.script_path }}"
          elif git diff --name-only HEAD~1 HEAD -- '.github/smoke/tts.txt' | grep -q .; then
            SCRIPT=".github/smoke/tts.txt"
          else
            SCRIPT="$(git diff --name-only HEAD~1 HEAD -- 'episodes/**/voice-input.txt' | head -n 1)"
            SCRIPT="${SCRIPT:-episodes/001-scheeles-green/voice-input.txt}"
          fi
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            exit 1
          fi
          DIR="$(dirname "$SCRIPT")"
          STEM="$(basename "$SCRIPT" | sed 's/\.[^.]*$//')"
          EP="$(basename "$DIR")"
          echo "script=$SCRIPT"   >> "$GITHUB_OUTPUT"
          echo "dir=$DIR"         >> "$GITHUB_OUTPUT"
          echo "stem=$STEM"       >> "$GITHUB_OUTPUT"
          echo "episode=$EP"      >> "$GITHUB_OUTPUT"
          echo "Voicing $SCRIPT (episode folder: $EP)"

      - name: Synthesize narration
        run: |
          python scripts/edge_tts_actions.py "${{ steps.resolve.outputs.script }}" \
            --voice="${{ inputs.voice || 'en-US-AndrewMultilingualNeural' }}" \
            --rate="${{ inputs.rate || '-3%' }}"

      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ steps.resolve.outputs.episode }}
          path: |
            ${{ steps.resolve.outputs.dir }}/${{ steps.resolve.outputs.stem }}.audio.wav
            ${{ steps.resolve.outputs.dir }}/${{ steps.resolve.outputs.stem }}.words.json
            ${{ steps.resolve.outputs.dir }}/${{ steps.resolve.outputs.stem }}.timing.json
          if-no-files-found: error
          retention-days: 90

      # Connector-readable run record: the GitHub connector has no Actions
      # API, so every workflow commits its structured results back to
      # runs/<workflow>/<run-id>/ — that folder IS how results are read.
      # runs/** matches no workflow's push paths, so this cannot retrigger.
      - name: Commit run record
        if: always()
        shell: bash
        env:
          DIR: ${{ steps.resolve.outputs.dir }}
          STEM: ${{ steps.resolve.outputs.stem }}
          EPISODE: ${{ steps.resolve.outputs.episode }}
          SCRIPT: ${{ steps.resolve.outputs.script }}
          JOB_STATUS: ${{ job.status }}
        run: |
          REC="runs/voice-tts/${{ github.run_id }}"
          mkdir -p "$REC"
          for f in "$STEM.words.json" "$STEM.timing.json"; do
            [ -f "$DIR/$f" ] && cp "$DIR/$f" "$REC/$f" || true
          done
          REC="$REC" python3 - <<'PY'
          import json, os
          rec = os.environ["REC"]
          words, blocks, dur = None, None, None
          wj = os.path.join(rec, os.environ["STEM"] + ".words.json")
          tj = os.path.join(rec, os.environ["STEM"] + ".timing.json")
          if os.path.exists(wj):
              words = len(json.load(open(wj)))
          if os.path.exists(tj):
              t = json.load(open(tj))
              blocks = len(t)
              dur = round(sum(v["dur"] for v in t.values()), 2)
          status = {
              "workflow": "voice-tts",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "job_status": os.environ.get("JOB_STATUS"),
              "sha": os.environ.get("GITHUB_SHA"),
              "script": os.environ.get("SCRIPT"),
              "episode": os.environ.get("EPISODE"),
              "timed_words": words,
              "blocks": blocks,
              "speech_seconds_blocks_only": dur,
              "audio_artifact": "voice-" + (os.environ.get("EPISODE") or ""),
              "note": "audio.wav itself lives in the run artifact, not git; words/timing are the caption contract",
          }
          json.dump(status, open(os.path.join(rec, "status.json"), "w"), indent=1)
          print(json.dumps(status))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REC"
          if git diff --cached --quiet; then
            echo "nothing to record"
          else
            git commit -m "runs: voice-tts ${{ github.run_id }} (${JOB_STATUS})"
            for attempt in 1 2 3; do
              git fetch origin "${{ github.ref_name }}"
              git rebase "origin/${{ github.ref_name }}" || git rebase --abort
              if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
              echo "push rejected (attempt $attempt) - remote moved; rebasing and retrying"
              sleep 5
            done
          fi
